[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "odelab-cpp"
version = "0.1.0"
description = "Small compiled ODE solvers and Python experiments"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]
examples = ["matplotlib>=3.8"]

[tool.scikit-build]
wheel.packages = ["src/odelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
